<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muse はじめてのアクションプラン</title>
<style>
:root{--ink:#20252b;--green:#238636;--paper:#fffdf7}
*{box-sizing:border-box}body{margin:0;background:#f3f1e9;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:1100px;margin:auto;padding:22px 14px 44px}h1{text-align:center;font-size:clamp(1.7rem,5vw,2.8rem);margin:0 0 26px}
.action{margin:0 0 34px}.action-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 4px 10px}.action-head h2{margin:0;font-size:1.15rem}.purpose{margin:0;font-weight:750}
.strip{display:flex;align-items:center;overflow-x:auto;gap:0;padding:8px 8px 16px;scroll-snap-type:x mandatory;scrollbar-width:thin;overscroll-behavior-x:contain}
.panel{flex:0 0 min(68vw,270px);border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--paper);box-shadow:4px 4px 0 var(--ink);scroll-snap-align:center;cursor:pointer;animation:framePulse 2s infinite}
.panel svg{display:block;width:100%;height:auto}.panel:focus-visible,.arrow:focus-visible{outline:4px solid #e4aa18;outline-offset:4px}
.arrow{flex:0 0 48px;border:0;background:none;color:var(--green);font-size:2.5rem;font-weight:900;cursor:pointer;animation:arrowBlink 1s infinite}
.scene-bg{fill:#eaf2ff}.burst{fill:#ffe16b;stroke:#20252b;stroke-width:3}.person{transform-box:fill-box;transform-origin:center bottom;animation:hop 1.6s ease-in-out infinite}.bubble{transform-box:fill-box;transform-origin:center;animation:pop .75s cubic-bezier(.2,1.5,.5,1) both}.spark{animation:twinkle 1s ease-in-out infinite alternate}.speed{stroke:#20252b;stroke-width:4;stroke-linecap:round;animation:dash .7s ease-in-out infinite alternate}
.svg-step{font-size:15px;font-weight:900;fill:#238636}.svg-action{font-size:20px;font-weight:900;fill:#20252b}.bubble-text{font-size:17px;font-weight:900;fill:#20252b}.impact{font-size:25px;font-weight:1000;fill:#e34b35;stroke:#fff;stroke-width:4px;paint-order:stroke}
@keyframes hop{0%,100%{transform:translateY(0) rotate(0)}45%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes pop{0%{opacity:0;transform:scale(.45)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
@keyframes dash{from{opacity:.25;transform:translateX(-3px)}to{opacity:1;transform:translateX(3px)}}
@keyframes arrowBlink{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes framePulse{0%,100%{border-color:var(--ink)}50%{border-color:var(--green)}}
@media(max-width:560px){.panel{flex-basis:76vw}.arrow{flex-basis:34px;font-size:2rem}.action-head{display:block}.purpose{margin-top:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body><main><h1>Muse はじめてのアクションプラン</h1><div id="journey"></div></main>
<script>
const plans=[
 {title:"Action 1",purpose:"目的：Museで制作を始める",steps:[
  ["Museを開く","さあ、はじめよう！","OPEN!","🌱"],
  ["アカウントでログインする","ログインできた！","LOGIN!","🔑"],
  ["新しいチャットを開く","ここから相談！","CHAT!","💬"],
  ["Museに話しかける","Muse、こんにちは！","HELLO!","✨"]]},
 {title:"Action 2",purpose:"目的：GitHubと連携する",steps:[
  ["MuseのConnectorsを開く","連携設定へ！","CONNECT!","🔌"],
  ["GitHubを選ぶ","GitHubを発見！","GITHUB!","🐙"],
  ["GitHubで接続を許可する","接続を許可！","AUTHORIZE!","✅"],
  ["接続済みを確認する","つながった！","LINKED!","🔗"]]},
 {title:"Action 3",purpose:"目的：遊べるゲームを完成させる",steps:[
  ["作りたいゲームを伝える","こんなゲームがほしい！","IDEA!","🎮"],
  ["ルールと操作を決める","ルールはこれだ！","RULES!","🕹️"],
  ["Museにゲーム制作を依頼する","ゲームを作って！","BUILD!","🛠️"],
  ["ゲームを動かして確認する","動いた！遊んでみよう！","PLAY!","🚀"]]}
];
const root=document.getElementById("journey");
root.innerHTML=plans.map((plan,pi)=>'<section class="action"><div class="action-head"><h2>'+plan.title+'</h2><p class="purpose">'+plan.purpose+'</p></div><div class="strip" aria-label="'+plan.title+' 4コマ">'+plan.steps.map((step,i)=>'<article class="panel" tabindex="0" role="button" aria-label="'+step[0]+'。クリックで次へ"><svg viewBox="0 0 320 230" role="img" aria-label="'+step[0]+'"><rect width="320" height="230" class="scene-bg"/><path class="burst" d="M18 18l18 5 12-15 8 19 20-1-12 16 11 18-21-3-9 18-7-19-21 1 12-17z"/><path class="speed" d="M24 150h48M18 166h34M254 178h42"/><g class="person"><circle cx="158" cy="133" r="35" fill="#ffd6b5" stroke="#20252b" stroke-width="4"/><path d="M126 126q5-43 42-32 20 7 23 31-20-14-39-10-13 2-26 11" fill="#303747"/><circle cx="146" cy="133" r="4" fill="#20252b"/><circle cx="170" cy="133" r="4" fill="#20252b"/><path d="M149 149q10 9 20 0" fill="none" stroke="#20252b" stroke-width="3" stroke-linecap="round"/><path d="M130 169q28-18 56 0l12 49h-80z" fill="'+(pi===1?'#8ec5ff':pi===2?'#ff9d80':'#9bd7a5')+'" stroke="#20252b" stroke-width="4"/></g><g class="bubble"><path d="M190 22h111q10 0 10 10v47q0 10-10 10h-48l-18 17 3-17h-48q-10 0-10-10V32q0-10 10-10" fill="#fff" stroke="#20252b" stroke-width="3"/><text x="246" y="54" text-anchor="middle" class="bubble-text">'+step[1]+'</text></g><text x="18" y="215" class="svg-step">'+(i+1)+' / 4</text><text x="160" y="28" text-anchor="middle" class="impact">'+step[2]+'</text><text x="160" y="206" text-anchor="middle" font-size="24" class="spark">'+step[3]+'</text></svg></article>'+(i<3?'<button class="arrow" type="button" aria-label="次のコマへ">→</button>':'' )).join("")+'</div></section>').join("");
document.querySelectorAll(".action").forEach(section=>{const cards=[...section.querySelectorAll(".panel")];const arrows=[...section.querySelectorAll(".arrow")];const go=i=>cards[i+1]?.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});arrows.forEach((b,i)=>b.addEventListener("click",()=>go(i)));cards.forEach((c,i)=>{c.addEventListener("click",()=>go(i));c.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go(i)}})});});
</script></body></html>
