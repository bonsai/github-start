<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MuseとGitHubをつなごう</title>
<style>
:root{color-scheme:light;--ink:#20252b;--green:#238636;--paper:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:#f3f1e9;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{width:min(100%,1000px);margin:auto;padding:clamp(20px,5vw,48px) 18px 40px}
header{text-align:center;margin-bottom:26px}
h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.15;margin:0 0 12px}
.lead{font-size:clamp(1rem,2.5vw,1.25rem);margin:0;color:#555}
.comic{display:flex;align-items:center;gap:0;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:10px 8px 20px;scrollbar-width:thin}
.panel{flex:0 0 min(78vw,620px);background:var(--paper);border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:4px 4px 0 var(--ink);scroll-snap-align:center}
.panel svg{display:block;width:100%;height:auto}
.caption{font-weight:800;text-align:center;font-size:clamp(1rem,2.5vw,1.25rem);padding:10px 8px 14px;min-height:3.5em}
.flow-arrow{flex:0 0 64px;display:grid;place-items:center;color:var(--green);font-size:2.8rem;font-weight:900;line-height:1;border:0;background:transparent;cursor:pointer;animation:blink 1.15s infinite}
.panel{cursor:pointer;transition:transform .18s,box-shadow .18s;animation:panelBlink 1.8s infinite}.panel:focus-visible,.flow-arrow:focus-visible{outline:4px solid #f0b429;outline-offset:5px}.panel:hover{transform:translateY(-4px);box-shadow:6px 8px 0 var(--ink)}@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}@keyframes panelBlink{0%,100%{border-color:var(--ink)}50%{border-color:var(--green)}}
@media(max-width:560px){.panel{flex-basis:84vw}.flow-arrow{flex-basis:42px;font-size:2rem}}
</style>
</head>
<body>
<main>
<header>
<h1>MuseとGitHubをつなごう</h1>

</header>
<section class="comic" aria-label="MuseとGitHubを連携する流れ">
<article class="panel">
<svg viewBox="0 0 440 250" role="img" aria-label="Museのコネクタ画面を開く">
<rect width="440" height="250" fill="#e9f2ff"/>
<rect x="55" y="30" width="330" height="190" rx="14" fill="#fff" stroke="#20252b" stroke-width="6"/>
<rect x="55" y="30" width="330" height="38" rx="12" fill="#e8eaf0"/>
<circle cx="78" cy="49" r="6" fill="#f28b82"/><circle cx="98" cy="49" r="6" fill="#fbbc04"/><circle cx="118" cy="49" r="6" fill="#81c995"/>
<rect x="82" y="91" width="110" height="18" rx="8" fill="#dce4e8"/>
<rect x="82" y="123" width="276" height="60" rx="9" fill="#eef6ff" stroke="#238636" stroke-width="4"/>
<circle cx="115" cy="153" r="16" fill="#238636"/>
<path d="M108 153h14m-7-7v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="160" font-size="21" font-weight="800" fill="#20252b">Connectors</text>
</svg>
<div class="caption">① Museで「Connectors」を開く</div>
</article>
<button class="flow-arrow" type="button" aria-label="次のコマへ">→</button>
<article class="panel">
<svg viewBox="0 0 440 250" role="img" aria-label="GitHubコネクタを選ぶ">
<rect width="440" height="250" fill="#fff0dc"/>
<rect x="62" y="27" width="316" height="196" rx="14" fill="#fff" stroke="#20252b" stroke-width="6"/>
<text x="220" y="66" text-anchor="middle" font-size="23" font-weight="800" fill="#20252b">Connect a service</text>
<rect x="94" y="91" width="252" height="90" rx="12" fill="#f6f8fa" stroke="#238636" stroke-width="4"/>
<circle cx="139" cy="136" r="25" fill="#20252b"/>
<path d="M126 138c-5-12 3-22 13-22s18 10 13 22l-3 14h-20z" fill="#fff"/>
<text x="180" y="144" font-size="25" font-weight="900" fill="#20252b">GitHub</text>
<path d="M315 119l10 10-10 10" fill="none" stroke="#238636" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="caption">② 一覧からGitHubを選ぶ</div>
</article>
<button class="flow-arrow" type="button" aria-label="次のコマへ">→</button>
<article class="panel">
<svg viewBox="0 0 440 250" role="img" aria-label="GitHub側で接続を許可する">
<rect width="440" height="250" fill="#e9f7e9"/>
<rect x="64" y="27" width="312" height="196" rx="14" fill="#fff" stroke="#20252b" stroke-width="6"/>
<text x="220" y="69" text-anchor="middle" font-size="22" font-weight="800" fill="#20252b">Authorize access</text>
<rect x="105" y="91" width="230" height="48" rx="8" fill="#f1f3f4"/>
<text x="220" y="121" text-anchor="middle" font-size="17" fill="#20252b">Muse ↔ GitHub</text>
<rect x="125" y="158" width="190" height="42" rx="21" fill="#238636"/>
<text x="220" y="185" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">Authorize</text>
</svg>
<div class="caption">③ GitHubの画面で接続を許可</div>
</article>
<button class="flow-arrow" type="button" aria-label="次のコマへ">→</button>
<article class="panel">
<svg viewBox="0 0 440 250" role="img" aria-label="MuseとGitHubの接続完了">
<rect width="440" height="250" fill="#f1eaff"/>
<circle cx="220" cy="112" r="66" fill="#238636" stroke="#20252b" stroke-width="5"/>
<path d="M183 112l25 25 51-57" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M75 75l12 18 22-4-13 18 11 18-21-5-13 17-1-22-20-9 20-8zM350 150l10 15 18-3-10 15 9 16-18-4-11 14-1-18-17-8 17-7z" fill="#ffd76a" stroke="#20252b" stroke-width="3"/>
<text x="220" y="220" text-anchor="middle" font-size="22" font-weight="900" fill="#20252b">CONNECTED!</text>
</svg>
<div class="caption">④ 完了！MuseからGitHubを使えるよ 🎉</div>
</article>
</section>

</main>
</body>
</html>
